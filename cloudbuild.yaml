# Cloud Build → Artifact Registry → Cloud Run.
#
# Run by the `gold-deploy-main` trigger on every push to main. A proposed change runs
# cloudbuild.verify.yaml instead, which is this file's verify step and nothing else.
#
# Two deployed units and one job:
#   gold-api        Cloud Run service, the Hono API
#   gold-migrate    Cloud Run job, run once per release BEFORE traffic moves
#   (the SPA)       static apps/web build, pushed to Firebase Hosting after the API is live
#
# Substitutions are set on the trigger:
#   _REGION                asia-southeast1
#   _REPO                  Artifact Registry repository name
#   _SQL_INSTANCE          project:region:instance
#   _CORS_ORIGIN           https://the-spa-domain
#   _API_URL               https://the-cloud-run-url  (baked into the SPA bundle)
#
# Secrets (DATABASE_URL, JWT_SECRET) are never substitutions — they are bound to the service from
# Secret Manager at deploy time, so they exist only in the runtime environment and never in a
# build log, an image layer, or this file.

substitutions:
  _REGION: asia-southeast1
  _REPO: gold-platform
  _SQL_INSTANCE: ''
  _CORS_ORIGIN: ''
  _API_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:latest

steps:
  # Type-check and test before building. A build that ships a revision the test suite rejects is
  # not faster, it is just further along when it fails.
  - id: verify
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        # Without this, only the *last* command decides the step's exit code — a failing
        # type-check followed by passing tests reports success and ships. That is not
        # hypothetical: it is what this step did until the first real build exposed it.
        set -euo pipefail
        corepack enable
        pnpm install --frozen-lockfile
        pnpm type-check
        pnpm test

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api']

  # Migrations run as their own job, to completion, before any new revision serves traffic.
  # Never on server startup: a scale-up would race N instances through the same DDL.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - gold-migrate
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:${SHORT_SHA}
      - --command=node
      - --args=dist/scripts/migrate.js
      - --region=${_REGION}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=gold-database-url:latest
      - --max-retries=0
      - --execute-now
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gold-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gold-api:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      # No --allow-unauthenticated is *not* an option here: the SPA calls this from a browser with
      # its own JWT, so the service has to be publicly reachable. Authorization is the app's own
      # middleware. Everything except /health and /auth/login requires a token.
      - --allow-unauthenticated
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=gold-database-url:latest,JWT_SECRET=gold-jwt-secret:latest
      - --set-env-vars=CORS_ORIGIN=${_CORS_ORIGIN},NODE_ENV=production
      # Sized against measured volume, not a guess: the busiest domain peaks at ~15 transactions a
      # day, so all four together are on the order of 60 — call it one every eight minutes across a
      # working day. One instance serves that with room to spare.
      #
      # The ceiling exists to bound connections against Cloud SQL, not to absorb load, so it is the
      # smallest number that still allows a rolling deploy to overlap the old revision. Each
      # instance opens up to `max` postgres.js connections (set to 5 in db/client.ts), so the worst
      # case here is 10 plus the migration job — comfortably inside a shared-core instance's limit.
      # It was 4, which paired with the driver's default pool of 10 to allow 40.
      #
      # min-instances is the one setting here with a real price attached, and the price changes when
      # the 90-day trial credit runs out. Read this before paying a bill you did not expect.
      #
      # Cloud Run's permanent free tier is 2M requests, 180,000 vCPU-seconds and 360,000 GiB-seconds
      # a month. This service's *request* load uses about 3% of that. But a warm instance bills for
      # wall-clock time whether or not anything calls it: one instance held for a month is roughly
      # 2.6M vCPU-seconds, about fourteen times the whole allowance. So the flag below, not the
      # traffic, is what decides between a free service and one costing on the order of $20/month.
      #
      # It stays at 1 anyway, because during the trial it costs nothing and it is the better
      # experience: Cloud Run retires an idle instance after roughly fifteen minutes, and at one
      # request every eight minutes the traffic is sparse enough to cross that gap repeatedly — so 0
      # buys cold starts several times a day, not once in the morning.
      #
      # When the credit expires, that is the decision: keep paying ~$20/month for a warm instance,
      # or set this to 0 and accept a few seconds' wait on the first request after each idle gap.
      # At this volume nothing else on the service is load-bound, so it is the only lever that
      # meaningfully moves the bill. See docs/DEPLOY.md, "What this costs".
      - --min-instances=1
      - --max-instances=2
      - --cpu=1
      - --memory=512Mi
      # Cloud Run's default startup probe allows 240s; the server refuses to listen until it has
      # proven the database connection, so a genuinely unreachable database fails the revision
      # rather than serving 500s.
      - --timeout=60s

  # The SPA, after the API and never before it. `_API_URL` is inlined into the bundle by vite, so
  # this step ships a frontend pinned to a specific API — publishing it while the revision it talks
  # to is still the old one is the one ordering that can serve calls the backend does not have yet.
  #
  # node_modules is already here: Cloud Build steps share /workspace, and `verify` installed it.
  # Nothing else survives between steps, so the pnpm store and any npx download do not.
  #
  # The `...` in the filter is pnpm for "and its workspace dependencies", built in topological order.
  # @gold-platform/types resolves to dist/, so the web tsc cannot start until it is compiled. Today
  # `verify` happens to leave it there — `type-check` dependsOn `^build` — but that is a side effect
  # of another task's configuration, not something this step should rest on.
  #
  # An empty `_API_URL` fails the build rather than producing a bundle: vite.config.ts refuses a
  # production build without it, because the failure it prevents — a bundle silently pointing at
  # localhost — is invisible until someone tries to log in. It has happened once.
  #
  # firebase-tools is fetched per build rather than pinned in the lockfile. Cloud Build keeps no npm
  # cache between builds, so adding it as a dependency would download it every time anyway, for the
  # cost of a heavier install everywhere else. Pin the version here if a CLI release ever breaks a
  # deploy — the CLI is the only unpinned thing in this file.
  #
  # It authenticates as the build service account through the metadata server; there is no token to
  # store. The project comes from apps/web/.firebaserc and the site id from apps/web/firebase.json,
  # which is why this runs in that directory and passes neither.
  - id: web
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        corepack enable
        VITE_API_URL=${_API_URL} pnpm --filter '@gold-platform/web...' build
        cd apps/web
        npx --yes firebase-tools deploy --only hosting --non-interactive

# Five steps now, of which verify and the two builds dominate. The old 1200s left no headroom once
# the SPA build joined.
timeout: 1800s
