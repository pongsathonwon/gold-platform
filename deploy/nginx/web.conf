# The SPA, and the API under /api/ on the same origin. Baked into gold-platform-web by apps/web/Dockerfile.
# TLS ends at nginx-proxy-manager in front of this; it forwards plain HTTP here over the proxy network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, re-resolved every 10s. A literal upstream would be resolved once at
    # start-up and keep the old address after the api container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://gold-platform-api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Passed through UNCHANGED. nginx-proxy-manager has already appended the real client address,
        # and the login rate limiter reads the LAST entry (clientAddress() in rate-limit.ts). Appending
        # here would make that entry nginx-proxy-manager's container address, one bucket for everybody.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Content-hashed file names: cache for a year. A chunk that does not change is never fetched twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is the SPA (client-side routes: a refresh on /wholesale-buy/123 must not 404).
    # no-cache, so a returning operator picks up a new release on the next load, not an hour later.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
